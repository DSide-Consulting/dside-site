<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks — STAN | DSide Consulting</title>
<meta name="description" content="STAN finds the right PT for your back pain. Early tester sign-up.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0f2340">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e293b;--ink-soft:#475569;--muted:#64748b;
  --navy:#1a3a5c;--navy-deep:#0f2340;
  --teal:#0d9488;--teal-dark:#0b7c72;--teal-bright:#5eead4;--teal-tint:#ccfbf1;
  --line:#e2e8f0;--paper:#fff;--paper-alt:#f8fafc;
  --radius:14px;--maxw:760px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper);
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
h1,h2,h3{line-height:1.15;letter-spacing:-.022em}
h2{font-size:clamp(26px,3.6vw,34px);font-weight:800;margin-bottom:18px}
p{color:var(--ink-soft)}
p+p{margin-top:14px}
a{color:var(--teal)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:16px}

nav{border-bottom:1px solid var(--line);background:#fff}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-weight:900;font-size:18px;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
.brand span{color:var(--teal)}

.hero{background:
    radial-gradient(800px 460px at 80% 0%, rgba(13,148,136,.32), transparent 62%),
    linear-gradient(160deg,var(--navy-deep),var(--navy));
  color:#fff;padding:90px 0 80px}
.hero .eyebrow{color:var(--teal-bright)}
.hero h1{font-size:clamp(40px,7vw,64px);font-weight:900;letter-spacing:-.035em;margin-bottom:14px}
.hero .sub{font-size:21px;color:rgba(255,255,255,.82);font-weight:600}
.hero .note{margin-top:28px;color:rgba(255,255,255,.7);font-size:16.5px;max-width:56ch}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:15.5px;padding:14px 26px;border-radius:10px;
  background:var(--teal);color:#fff;border:0;cursor:pointer;font-family:inherit;box-shadow:0 2px 14px rgba(13,148,136,.28)}
.btn:hover{background:var(--teal-dark)}
.hero .btn{margin-top:32px}

section{padding:72px 0;border-bottom:1px solid var(--line)}
section.alt{background:var(--paper-alt)}

ul.plain{list-style:none;margin-top:18px}
ul.plain li{padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--line);color:var(--ink-soft)}
ul.plain li:first-child{border-top:0}
ul.plain li::before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:3px;background:var(--teal)}
ul.plain strong{color:var(--ink)}

.caveat{margin-top:24px;padding:18px 20px;border-left:3px solid var(--teal);background:#fff;border-radius:0 10px 10px 0;font-size:15.5px}

form{margin-top:26px;display:grid;gap:16px;max-width:460px}
label{font-size:14px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px}
input,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.hp{position:absolute;left:-9999px}
.fine{font-size:13.5px;color:var(--muted)}

footer{padding:40px 0 60px;font-size:14px;color:var(--muted)}
footer a{color:var(--muted)}
@media (max-width:560px){
  .hero{padding:64px 0 56px}
  section{padding:56px 0}
  .hero .sub{font-size:18.5px}
}
</style>
</head>
<body>

<nav><div class="wrap"><a class="brand" href="/">D<span>Side</span> Consulting</a></div></nav>

<header class="hero">
  <div class="wrap">
    <span class="eyebrow">STAN · Early testers</span>
    <h1>You're in.</h1>
    <p class="sub">Thanks. I'll email you the link when STAN is live.</p>
    <p class="note">Should be days, not weeks.</p>
  </div>
</header>

<footer>
  <div class="wrap">Daniel Seidler · <a href="/">DSide Consulting, LLC</a></div>
</footer>

</body>
</html>
